services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=geo
      - POSTGRES_PASSWORD=geopass123
      - POSTGRES_DB=gisdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_preload_libraries=pgrouting

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ..:/workspaces/gis_starter_pgrouting_geolab:cached
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://geo:geopass123@postgres:5432/gisdb
    depends_on:
      - postgres
    command: flask run --host=0.0.0.0 --port=5000

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask

  pgadmin:
    image: dpage/pgadmin4:8.11
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@geo.com
      - PGADMIN_DEFAULT_PASSWORD=adminpass123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: